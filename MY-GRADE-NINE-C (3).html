<style>
:root{--navy:#142B4A;--n7:#1B3A63;--n50:#EEF3F9;--n100:#DCE6F1;--n200:#B7CBE0;--soft:#4776A8;--s50:#EEF4FA;--bg:#F4F6F9;--ink:#263445;--mut:#64748b;--line:#e2e8f0;--ok:#047857;--okb:#ecfdf5;--warn:#b45309;--warnb:#fffbeb;--bad:#b91c1c;--badb:#fef2f2;--sh:0 1px 2px rgba(20,43,74,.04),0 10px 28px -14px rgba(20,43,74,.16)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
/* layout */
.side{display:none}.main{padding:16px 14px 100px;max-width:1100px;margin:0 auto}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:14px}
.top .ib{color:#fff}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(20,43,74,.3)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--mut);background:none;border:0;border-radius:12px;cursor:pointer}
.bnav .on{color:var(--navy);background:var(--n50)}
nav.nv{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
nav.nv a,nav.nv .lo{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:13.5px;color:var(--n200);background:none;border:0;cursor:pointer;text-align:left}
nav.nv a:hover,nav.nv .lo:hover{background:rgba(255,255,255,.08);color:#fff}
nav.nv a.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 var(--soft)}
nav.nv .lo{margin-top:12px}
.who{padding:12px;border-top:1px solid rgba(255,255,255,.12);color:#fff;font-weight:700}.who small{display:block;color:var(--n200);font-weight:500}
.drawer{position:fixed;inset:0;z-index:50;display:none}.open .drawer{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(10,24,40,.6)}
.drawer .pn{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:320px;background:var(--navy);color:#fff;padding:16px;display:flex;flex-direction:column;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(-100%)}}
@media(min-width:1024px){
 .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:272px;background:var(--navy);color:#fff;padding:20px 14px}
 .side .brand{padding:4px 10px 22px}.top,.bnav,.drawer{display:none!important}
 .main{margin-left:272px;max-width:none;padding:32px 40px 48px}.main>.in{max-width:1100px;margin:0 auto}
}
/* ui */
.ph1{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
@media(min-width:640px){.ph1{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.ph1 h1{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}.ph1 p{color:var(--mut);margin-top:2px;max-width:640px;font-size:13px}
.ac{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:#fff;border:1px solid #f1f5f9;border-radius:16px;box-shadow:var(--sh)}.pad{padding:18px}
.card h2{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:12px}.card h2 .ic{color:var(--soft)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.g5{grid-template-columns:repeat(5,1fr)}}
.span2{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .15s;min-height:42px}
.btn.sm{padding:6px 10px;font-size:12px;min-height:32px}.btn.pri{background:var(--navy);color:#fff}.btn.pri:hover{background:var(--n7)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--navy)}.btn.sec:hover{background:var(--n50)}
.btn.ok{background:#059669;color:#fff}.btn.bad{background:#dc2626;color:#fff}.btn.full{width:100%}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:none;color:#64748b;cursor:pointer}.ib:hover{background:var(--n50);color:var(--navy)}.ib.d:hover{background:var(--badb);color:var(--bad)}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--s50);color:var(--n7)}.b-mute{background:#f1f5f9;color:#475569}.b-navy{background:var(--navy);color:#fff}
.lb{display:block;font-weight:600;font-size:13px;color:var(--navy);margin-bottom:6px}
.in2,input[type=text],input[type=email],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px;min-height:42px}
textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--soft);box-shadow:0 0 0 3px rgba(71,118,168,.2)}
.fld{margin-bottom:14px}.hint{font-size:12px;color:var(--mut);margin-top:4px}
.fb{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}.fb>div{flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #f1f5f9;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}tr:last-child td{border-bottom:0}
td.act{text-align:right;white-space:nowrap}.mut{color:var(--mut)}
.stat{padding:16px}.stat .l{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;margin-bottom:8px}.stat .l span{background:var(--n50);color:var(--navy);padding:7px;border-radius:9px;display:inline-grid}
.stat b{font-size:22px;color:var(--navy);font-weight:800;letter-spacing:-.02em}.stat small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
a.stat{display:block}a.stat:hover{transform:translateY(-2px)}
.note{border:1px solid;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px}.n-info{background:var(--s50);border-color:var(--n100);color:var(--n7)}.n-warn{background:var(--warnb);border-color:#fde68a;color:#92400e}
.emp{text-align:center;padding:36px 16px}.emp b{display:block;color:var(--navy)}.emp p{color:var(--mut);font-size:13px;margin-top:2px}
.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.ol li{display:flex;align-items:center;gap:10px}
.ol i{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--n50);color:var(--navy);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.ol .t{flex:1}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--n50);color:var(--navy);padding:4px 12px;border-radius:99px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chips button{border:0;background:none;color:var(--mut);cursor:pointer;padding:0;display:grid}
.tip{margin-top:12px;background:var(--s50);color:var(--n7);padding:8px 12px;border-radius:10px;font-size:12.5px}
.day.today{outline:2px solid var(--soft)}.dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.dh h2{margin:0;font-size:17px}.dh small{color:var(--mut);display:block}
.sub{font-size:11.5px;font-weight:700;color:var(--mut);margin:14px 0 8px}
.hero{background:var(--navy);color:#fff;padding:22px;display:flex;align-items:center;gap:16px;border-radius:16px 16px 0 0}
.hero .logo{width:68px;height:68px;font-size:22px;border-radius:18px}.hero h2{color:#fff;font-size:20px;margin:0}.hero p{color:var(--n200)}
.dl{display:grid;grid-template-columns:1fr;gap:1px;background:#f1f5f9}@media(min-width:640px){.dl{grid-template-columns:1fr 1fr}}
.dl div{background:#fff;padding:14px 18px}.dl small{color:var(--mut);font-size:12px;display:block}.dl b{color:var(--navy)}
.org{padding:18px}.tier{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.vl{width:1px;height:26px;background:rgba(20,43,74,.25);margin:0 auto}
.node{width:100%;max-width:230px;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fff}.node.head{background:var(--navy);color:#fff;border-color:var(--navy)}
.node small{display:block;font-weight:700;color:var(--soft);font-size:12px}.node.head small{color:var(--n200)}.node b{display:block;margin-top:2px}.node .nb{margin-top:8px;background:#f8fafc;border-radius:10px;display:flex;justify-content:center}
.node.head .nb{background:rgba(255,255,255,.1)}.node.head .ib{color:#fff}
.albums{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:560px){.albums{grid-template-columns:1fr 1fr}}@media(min-width:1024px){.albums{grid-template-columns:repeat(3,1fr)}}
.ph{aspect-ratio:4/3;display:grid;place-items:center;color:rgba(255,255,255,.9);font-weight:700;font-size:13px;position:relative;width:100%;border:0}
.ph em{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.35);font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:99px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:640px){.photos{grid-template-columns:repeat(3,1fr)}}@media(min-width:1024px){.photos{grid-template-columns:repeat(4,1fr)}}
.photos .ph{aspect-ratio:1;border-radius:12px;cursor:pointer}.pw{position:relative}.pw .ib{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.92);width:30px;height:30px}
.lbx{position:fixed;inset:0;z-index:120;background:rgba(10,24,40,.95);display:flex;flex-direction:column;color:#fff}
.lbx .m{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}.lbx .ph{max-width:760px;max-height:70vh;aspect-ratio:4/3;border-radius:14px}.lbx .ib{color:#fff;background:rgba(255,255,255,.12)}.lbx p{text-align:center;padding:14px;color:rgba(255,255,255,.8)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}.bars .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end}.bars .p{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bars .p i{display:block;width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--navy);min-height:2px}.bars .p i+i{background:rgba(71,118,168,.5)}.bars small{text-align:center;margin-top:6px;color:var(--mut);font-size:11.5px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--navy);margin-right:5px}.lg i+i,.lg span+span i{background:rgba(71,118,168,.5)}
.inc{color:var(--ok);font-weight:700}.exp{color:var(--bad);font-weight:700}
.rad{display:grid;gap:8px;grid-template-columns:1fr}@media(min-width:560px){.rad{grid-template-columns:1fr 1fr}}
.rad label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;cursor:pointer}.rad input{width:18px;height:18px;accent-color:var(--navy)}
.rad label:has(input:checked){border-color:var(--soft);background:var(--s50)}
.ann{border-bottom:1px solid #f1f5f9;padding:12px 0}.ann:last-child{border:0;padding-bottom:0}.ann:first-of-type{padding-top:0}.ann b{color:var(--navy)}.ann p{color:#475569;margin-top:2px;white-space:pre-line}.ann small{color:#94a3b8}
.lgl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:#475569;font-size:13px}.lgl small{color:#94a3b8;white-space:nowrap}
/* login */
.lg2{min-height:100vh;display:grid}
@media(min-width:900px){.lg2{grid-template-columns:1.1fr 1fr}}
.lp{background:var(--navy);color:#fff;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;overflow:hidden}
.lp .big{font-size:110px;font-weight:800;line-height:.9;letter-spacing:-.05em;color:rgba(255,255,255,.1)}
@media(min-width:900px){.lp{padding:56px}.lp .big{font-size:180px}}
.lp h1{font-size:28px;font-weight:800;line-height:1.2;margin-top:-18px;max-width:420px}.lp p{color:var(--n200);max-width:360px;margin-top:10px}
.lf{display:flex;align-items:center;justify-content:center;padding:28px 20px}.lf>div{width:100%;max-width:380px}.lf h2{font-size:24px;color:var(--navy);margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--n50);padding:4px;border-radius:12px;margin:18px 0}
.tabs button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--mut);cursor:pointer}.tabs .on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.or{text-align:center;color:#94a3b8;font-size:12px;margin:14px 0}
/* modal & toast */
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,43,74,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center;padding:16px}}
.dlg{background:#fff;width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px;box-shadow:0 20px 50px -18px rgba(20,43,74,.4);animation:rise .22s ease-out}
@media(min-width:640px){.dlg{max-width:480px;border-radius:18px}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.dlg .dh{margin-bottom:12px}.dlg h2{font-size:17px;color:var(--navy)}.df{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}.dlg p.tx{margin-bottom:12px;color:#475569}
#toasts{position:fixed;left:0;right:0;bottom:84px;z-index:130;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;pointer-events:none}
@media(min-width:1024px){#toasts{bottom:20px;align-items:flex-end;padding:0 24px}}
.ts{pointer-events:auto;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px -18px rgba(20,43,74,.4);border-radius:12px;padding:11px 14px;max-width:380px;width:100%;font-size:13.5px;font-weight:600;border-left:4px solid var(--ok);animation:rise .22s}.ts.err{border-left-color:var(--bad)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}



.pw2{position:relative}.pw2 input{padding-right:46px}.pw2 .ib{position:absolute;right:3px;top:3px}
.lerr{background:var(--badb);border-color:#fecaca;color:var(--bad);font-weight:600}.lsmall{text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spn .7s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.7;cursor:progress}
.cred{background:var(--n50);border:1px solid var(--n100);border-radius:12px;padding:14px;margin:4px 0}.cred small{display:block;color:var(--mut);margin-bottom:4px}.cred code{font-size:16px;font-weight:700;color:var(--navy);word-break:break-all;user-select:all}
code{background:#f1f5f9;border-radius:6px;padding:1px 6px;font-size:12.5px}

const $ = (s, r = document) => r.querySelector(s);

  <section class="card pad"><h2>Ganti password</h2><form id="rp" novalidate>${fld('Password baru', 'nw', { type: 'password', req: true, hint: 'Minimal 12 karakter.' })}${fld('Ulangi password baru', 'nw2', { type: 'password', req: true })}<button class="btn pri" type="submit">Simpan password</button></form></section>` +
    (isT() ? `<section class="card pad span2"><h2>Data demo</h2><p class="mut" style="margin-bottom:12px">Fitur kelas masih memakai data contoh di memori browser. Tombol di bawah mengembalikan data demo ke kondisi awal.</p><button class="btn sec" data-act="reset">Reset data demo</button></section>` : '') + '</div>';
}
document.addEventListener('submit', async (e) => {
  const id = e.target.id; if (id !== 'rp' && id !== 'akf') return; e.preventDefault();
  const f = new FormData(e.target);
  if (id === 'rp') {
    if (!U || !SB) return; const nw = f.get('nw');
    if (nw.length < 12) return toast('Password baru minimal 12 karakter.', 'err'); if (nw !== f.get('nw2')) return toast('Konfirmasi password tidak sama.', 'err');
    const { error } = await SB.auth.updateUser({ password: nw }); if (error) return toast(error.code === 'same_password' ? 'Password baru harus berbeda dari yang lama.' : error.code === 'weak_password' ? 'Password terlalu lemah.' : 'Gagal mengganti password.', 'err'); e.target.reset(); toast('Password berhasil diganti.');
  } else {
    if (!isP()) return deny(); const pw = f.get('password');
    if (pw.length < 12) return toast('Password awal minimal 12 karakter.', 'err');
    const r = await callFn('create', { username: f.get('username').trim().toLowerCase(), full_name: f.get('full_name').trim(), role: f.get('role'), password: pw });
    if (!r.ok) return toast(r.msg, 'err'); e.target.reset(); ACC.rows = null; re(); toast('Akun berhasil dibuat.');
  }
});
bootSession();
const hasStored = !!SB && Object.keys(localStorage).some((k) => /^sb-.*-auth-token$/.test(k));
if (!U && !hasStored) setHash('#/login');
if (!hasStored) render();

</script>
</body>
</html>
